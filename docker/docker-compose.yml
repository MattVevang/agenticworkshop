services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.12
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Connect to Ollama running on the Windows host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # Disable authentication for frictionless workshop/lab use.
      # This runs in shared kiosk mode — all students see the same
      # chat history and settings. Acceptable for a single-day workshop.
      - WEBUI_AUTH=false

      # Default model students see when they first open the UI
      - DEFAULT_MODELS=llama3.2:3b

      # Pin workshop models at the top of the model selector dropdown.
      # Students still see other models, but these appear first.
      - DEFAULT_PINNED_MODELS=llama3.2:3b,llama3.2:1b,llama3.1:8b,mistral:7b,llava:7b

      # --- MODEL VISIBILITY RESTRICTION (Optional, 2-step setup) ---
      # To HIDE non-workshop models from the dropdown entirely:
      #   Step 1: Launch without this setting, open Admin Panel > Workspace > Models,
      #           and set each workshop model's access to "Public".
      #   Step 2: Uncomment the line below, then: docker compose up -d
      # This makes the kiosk admin respect model access controls, hiding
      # any model not explicitly set to Public. See workshop-tuning-guide.md.
      # - BYPASS_ADMIN_ACCESS_CONTROL=false

      # Disable telemetry for a local lab environment
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true

      # NOTE: The following Ollama environment variables should be set on the
      # HOST machine before running 'ollama serve' (not in this Docker file):
      #
      #   OLLAMA_HOST=0.0.0.0:11434          # Accept connections from Docker & network
      #   OLLAMA_NUM_PARALLEL=4              # Handle concurrent student requests
      #   OLLAMA_MAX_LOADED_MODELS=2         # Keep up to 2 models in VRAM (swap is ~1s on NVMe)
      #   OLLAMA_KEEP_ALIVE=2m               # Unload idle models after 2 min (fast NVMe reload)
      #   OLLAMA_CONTEXT_LENGTH=8192         # Reduce from 128k for workshop (saves VRAM)
      #
      # See resources/workshop-tuning-guide.md for full details and revert instructions.
      # See demos/scripts/ollama-warmup.py for the pre-workshop model preloader.

    volumes:
      # Persistent data so config survives container restarts
      - open-webui-data:/app/backend/data

    extra_hosts:
      # Ensure host.docker.internal resolves on all Docker versions
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
